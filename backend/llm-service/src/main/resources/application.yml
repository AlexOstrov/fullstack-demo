server:
  port: 8081

spring:
  application:
    name: llm-service

llm:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    connect-timeout: 5s
    chat-timeout: ${LLM_CHAT_TIMEOUT:30s}
    tags-timeout: 3s

app:
  llm:
    model: ${LLM_MODEL:qwen2.5:7b-instruct}
    allowed-models: ${LLM_ALLOWED_MODELS:qwen2.5:7b-instruct,qwen2.5:14b-instruct,llama3.1:8b-instruct}
    # Duration: числовое значение трактуется как миллисекунды
    refresh-interval: ${LLM_REFRESH_INTERVAL_MS:300000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.example.llmservice: INFO
